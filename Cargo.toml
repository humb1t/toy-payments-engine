[package]
edition = "2024"
name    = "toy-payments-engine"
version = "0.1.0"

[lints.rust]
trivial_casts            = "deny"
trivial_numeric_casts    = "deny"
unsafe_code              = "forbid"
variant_size_differences = "deny"

[lints.clippy]
todo          = "deny"
unimplemented = "deny"
unwrap_used   = "deny"

[dependencies]
cgp                           = "0.7.0"
csv                           = "1.3"
derive_more                   = { version = "2.1.1", features = ["constructor", "display", "error", "from"] }
primitive_fixed_point_decimal = { version = "1.4.0", features = ["serde"] }
# redb         = "3.1.1"
# redb_model   = "0.12.0"
# rust_decimal = { version = "1.40.0", features = ["serde-str"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
futures      = "0.3.32"
tokio        = { version = "1.50.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["io-util"] }
