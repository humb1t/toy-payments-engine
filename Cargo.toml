[package]
name = "toy-payments-engine"
version = "0.1.0"
edition = "2024"

[lints.rust]
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_code = "forbid"
variant_size_differences = "deny"

[lints.clippy]
todo = "deny"
