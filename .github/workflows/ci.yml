name: CI
on:
  push:
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      continue-on-error: false
      with:
        toolchain: stable
        components: clippy, rustfmt
    - run: |
        rustup --version
        cargo --version
        rustc --version
    - run: |
        cargo fmt --all -- --check
    - run: |
        cargo clippy --all --all-targets --all-features
    - run: cargo test
    - run: cargo test -- --ignored
